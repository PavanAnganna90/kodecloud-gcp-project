# Generic Deployment. Overlay sets the real app name, image, port, and namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      containers:
        - name: app
          image: APP_IMAGE
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
